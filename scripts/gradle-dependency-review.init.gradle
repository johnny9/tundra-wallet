// Explicit bootstrap and read-only validation of the complete dependency graph.
// See Gradle's dependency_locking and dependency_verification user guides.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.beforeProject { project ->
    project.dependencyLocking.lockAllConfigurations()
    project.buildscript.configurations.configureEach {
        resolutionStrategy.activateDependencyLocking()
    }
}

gradle.projectsEvaluated {
    gradle.rootProject.allprojects { project ->
        ['resolveDependencyReview', 'verifyDependencyReview'].each { taskName ->
            project.tasks.register(taskName) {
                notCompatibleWithConfigurationCache('Explicitly resolves configurations for dependency review')
                doFirst {
                    if (taskName == 'resolveDependencyReview' && !gradle.startParameter.writeDependencyLocks) {
                        throw new GradleException('Dependency review requires --write-locks')
                    }
                    if (taskName == 'verifyDependencyReview' && (gradle.startParameter.writeDependencyLocks ||
                            !gradle.startParameter.writeDependencyVerifications.empty)) {
                        throw new GradleException('Dependency verification must not write locks or checksums')
                    }
                }
                doLast {
                    def resolveModules = { configuration ->
                        logger.lifecycle("Reviewing dependency configuration ${project.path}:${configuration.name}")
                        configuration.incoming.resolutionResult.allDependencies.each { dependency ->
                            if (dependency instanceof UnresolvedDependencyResult) {
                                throw new GradleException('Dependency graph could not be resolved', dependency.failure)
                            }
                        }
                        // Android test configurations depend on this project's own
                        // unbuilt variants. Lock their complete graph, but collect only
                        // external module artifacts; normal CI builds project outputs.
                        // This view is strict: external artifact failures still fail.
                        configuration.incoming.artifactView {
                            componentFilter { it instanceof ModuleComponentIdentifier }
                        }.files.files
                    }
                    project.configurations.findAll { it.canBeResolved }.each(resolveModules)
                    project.buildscript.configurations.findAll { it.canBeResolved }.each(resolveModules)
                }
            }
        }
    }
}
