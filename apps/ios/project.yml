name: Tundra
options:
  bundleIdPrefix: dev.johnny9
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Tundra
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tundra:
    type: application
    platform: iOS
    sources:
      - path: Tundra
      - path: Generated
        includes:
          - "*.swift"
    dependencies:
      - framework: Frameworks/TundraCoreFFI.xcframework
        embed: false
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.johnny9.tundra.dev
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  Tundra:
    build:
      targets:
        Tundra: all
