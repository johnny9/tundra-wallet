[package]
name = "tundra-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bdk_wallet.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tundra-sqlcipher = { path = "../tundra-sqlcipher" }
zeroize = "=1.9.0"
base64 = "=0.22.1"
bhwi = { git = "https://github.com/wizardsardine/bhwi", rev = "edfac42caf0d67693660cf1f04c2d24ca6b8f7a1", default-features = false, features = ["ledger"] }
# Hardware dependencies must never emit public wallet metadata through a native logger.
log = { version = "=0.4.34", features = ["max_level_off", "release_max_level_off"] }
ur = "=0.5.2"
minicbor = { version = "=2.3.0", features = ["alloc"] }
bbqr = { version = "=0.6.0", default-features = false }
data-encoding = "=2.11.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
qrcode = { version = "=0.14.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "=1.49.0", features = ["rt", "time", "sync", "macros", "net"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
