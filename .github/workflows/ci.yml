name: Build and test development source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-and-dependency-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: mkdir -p build && cargo audit --json > build/audit.json
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: rustup toolchain install nightly-2026-09-07 --profile minimal
      - run: ./scripts/check-fuzz.sh > build/fuzz.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tundra-parser-and-dependency-results
          path: |
            build/audit.json
            build/fuzz.log
            build/fuzz-artifacts/
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - run: ./scripts/check.sh
      - run: ./scripts/install-bitcoin-ci.sh
      - run: ./scripts/check-regtest.sh
      - run: ./scripts/generate-bindings.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lock-and-offline-report
          path: |
            Cargo.lock
            build/offline-checks.json
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ./scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: ./apps/android/gradlew --no-daemon -p apps/android :app:assembleDebug :app:testDebugUnitTest
      - name: Enable KVM for the hosted Android emulator
        run: sudo chmod 666 /dev/kvm
      - run: ./scripts/install-bitcoin-ci.sh
      - name: Start keyless native test chain
        run: |
          python3 tests/native_chain.py > build/native-chain.log 2>&1 &
          for attempt in $(seq 1 60); do
            test -f build/native-chain-port && exit 0
            sleep 1
          done
          cat build/native-chain.log
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb reverse tcp:3002 tcp:3002
            ./apps/android/gradlew --no-daemon -p apps/android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: tundra-development-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tundra-jvm-test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tundra-android-runtime-results
          path: apps/android/app/build/outputs/androidTest-results/connected/**
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - run: brew install xcodegen
      - run: ./scripts/build-ios.sh
      - run: ./scripts/check-swift-ffi.sh
      - run: cd apps/ios && xcodegen generate
      - run: xcodebuild -project apps/ios/Tundra.xcodeproj -scheme Tundra -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: ./scripts/install-bitcoin-ci.sh
      - name: Start keyless native test chain
        run: |
          python3 tests/native_chain.py > build/native-chain.log 2>&1 &
          for attempt in $(seq 1 60); do
            test -f build/native-chain-port && exit 0
            sleep 1
          done
          cat build/native-chain.log
          exit 1
      - run: ./scripts/check-ios-runtime.sh
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tundra-ios-runtime-results
          path: build/ios-runtime.xcresult
