name: Build and test development source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-and-dependency-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: mkdir -p build && cargo audit --json > build/audit.json
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: rustup toolchain install nightly-2026-09-07 --profile minimal
      - run: ./scripts/check-fuzz.sh > build/fuzz.log 2>&1
      - run: python3 scripts/cargo-notices.py --fetch > build/cargo-notices-check.log
      - run: python3 scripts/android-notices.py > build/android-notices-check.log
      - run: python3 scripts/android-artifact-notices.py > build/android-artifact-notices-check.log
      - run: python3 scripts/package-notices.py > build/native-notice-resource-check.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tundra-parser-and-dependency-results
          path: |
            build/audit.json
            build/fuzz.log
            build/cargo-notices-check.log
            build/android-notices-check.log
            build/android-artifact-notices-check.log
            build/native-notice-resource-check.log
            build/fuzz-artifacts/
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          components: rustfmt, clippy
      - run: ./scripts/check.sh
      - run: ./scripts/install-bitcoin-ci.sh
      - run: ./scripts/check-regtest.sh
      - run: ./scripts/generate-bindings.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lock-and-offline-report
          path: |
            Cargo.lock
            build/offline-checks.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: python3 scripts/native-toolchains.py --fetch --sdk "$ANDROID_HOME"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ./scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify all locked Android dependency configurations
        run: >-
          ./apps/android/gradlew --no-daemon -p apps/android
          -I "$GITHUB_WORKSPACE/scripts/gradle-dependency-review.init.gradle"
          verifyDependencyReview :app:verifyDependencyReview
      - run: ./apps/android/gradlew --no-daemon -p apps/android :app:assembleDebug :app:testDebugUnitTest
      - run: python3 scripts/package-notices.py --android-apk apps/android/app/build/outputs/apk/debug/app-debug.apk
      - run: python3 scripts/check-android-native-artifacts.py apps/android/app/build/outputs/apk/debug/app-debug.apk > build/android-native-artifacts.json
      - run: python3 scripts/check-gradle-enforcement.py
      - name: Enable KVM for the hosted Android emulator
        run: sudo chmod 666 /dev/kvm
      - run: ./scripts/install-bitcoin-ci.sh
      - name: Start keyless native test chain
        run: |
          python3 tests/native_chain.py > build/native-chain.log 2>&1 &
          for attempt in $(seq 1 60); do
            test -f build/native-chain-port && exit 0
            sleep 1
          done
          cat build/native-chain.log
          exit 1
      - run: |
          bash scripts/start-published-native-fixture.sh
          bash scripts/start-published-native-fixture.sh --screen
      - uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/check-android-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tundra-development-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tundra-instrumentation-apk
          path: apps/android/app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tundra-jvm-test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tundra-android-runtime-results
          path: |
            apps/android/app/build/outputs/androidTest-results/connected/**
            build/android-restart*.log
            build/android-restart*.xml
            build/native-chain.log
            build/android-public-test-diagnostics/
            build/published-native-server.log
            build/published-screen-server.log
            build/gradle-enforcement/*.log
            build/android-native-artifacts.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.93.1-
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - run: python3 scripts/native-toolchains.py --fetch --install-xcodegen
      - run: ./scripts/build-ios.sh
      - run: ./scripts/check-swift-ffi.sh
      - run: cd apps/ios && xcodegen generate
      - name: Check generated iOS fixture target boundaries
        run: |
          plutil -convert json -o build/ios-project.json apps/ios/Tundra.xcodeproj/project.pbxproj
          python3 scripts/check-ios-fixture-boundary.py build/ios-project.json
      - run: xcodebuild -project apps/ios/Tundra.xcodeproj -scheme Tundra -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios-derived -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - run: python3 scripts/package-notices.py --ios-app build/ios-derived/Build/Products/Debug-iphonesimulator/Tundra.app
      - run: ./scripts/install-bitcoin-ci.sh
      - name: Start keyless native test chain
        run: |
          python3 tests/native_chain.py > build/native-chain.log 2>&1 &
          for attempt in $(seq 1 60); do
            test -f build/native-chain-port && exit 0
            sleep 1
          done
          cat build/native-chain.log
          exit 1
      - run: |
          bash scripts/start-published-native-fixture.sh
          bash scripts/start-published-native-fixture.sh --screen
      - run: ./scripts/check-ios-runtime.sh
        timeout-minutes: 20
      - name: Export simulator test diagnostics
        if: always()
        run: |
          if test -d build/ios-runtime.xcresult; then
            xcrun xcresulttool get test-results summary --path build/ios-runtime.xcresult > build/ios-runtime-summary.json
            xcrun xcresulttool export attachments --path build/ios-runtime.xcresult --output-path build/ios-runtime-attachments
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tundra-ios-runtime-results
          path: |
            build/ios-runtime.xcresult
            build/ios-runtime-summary.json
            build/ios-runtime-attachments/
            build/native-chain.log
            build/published-native-server.log
            build/published-screen-server.log
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
